name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to draft (e.g. v0.4.0 or v0.4.0-rc.1)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      base_version: ${{ steps.meta.outputs.base_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: meta
        name: Validate release tag and manifest version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"].strip()
          match = re.fullmatch(r"v([0-9]+\.[0-9]+\.[0-9]+)(?:-([0-9A-Za-z.-]+))?", tag)
          if not match:
              raise SystemExit(
                  f"Invalid release tag {tag!r}: expected vX.Y.Z or vX.Y.Z-<prerelease>"
              )

          base_version = match.group(1)
          prerelease = "true" if match.group(2) else "false"
          manifest = json.loads(Path("imomoe_native_base.pplugin").read_text(encoding="utf-8"))
          manifest_version = manifest.get("version")
          if manifest_version != base_version:
              raise SystemExit(
                  f"Tag base version {base_version!r} does not match "
                  f"imomoe_native_base.pplugin version {manifest_version!r}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8", newline="\n") as out:
              out.write(f"tag={tag}\n")
              out.write(f"base_version={base_version}\n")
              out.write(f"prerelease={prerelease}\n")
          print(f"Prepared tag={tag} base_version={base_version} prerelease={prerelease}")
          PY

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            generator: plugify-gen.exe
          - runner: ubuntu-latest
            platform: linux-x64
            generator: plugify-gen
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.4
      - name: Install fixed binding generator
        shell: pwsh
        run: |
          $env:GOBIN = Join-Path $PWD '.work/tools'
          go install '-ldflags=-s -w -X main.version=v1.2.15' github.com/untrustedmodders/plugify-gen/cmd/plugify-gen@v1.2.15
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check gamedata
        run: python scripts/validate-native-gamedata.py
      - name: Build NativeBase and verify CTest
        shell: pwsh
        run: |
          $image = @()
          if ($IsLinux) {
            $image = @('--container-image', 'registry.gitlab.steamos.cloud/steamrt/sniper/sdk@sha256:bb30053d3cd19d35c76ae69b2790dbaa1430448006f8240cb6d7e723f2d1940e')
          }
          python -u scripts/build-sdk.py --generator ".work/tools/${{ matrix.generator }}" --work-dir .work/ci --dist dist @image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-imomoe-native-base-${{ matrix.platform }}
          path: dist/imomoe-native-base-*-${{ matrix.platform }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-s2sdk-fork-${{ matrix.platform }}
          path: dist/s2sdk-fork-*-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify archives and generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(release-assets/*.zip)
          if (( ${#zips[@]} < 4 )); then
            echo "Expected at least 4 release ZIPs, got ${#zips[@]}" >&2
            ls -la release-assets >&2
            exit 1
          fi
          (cd release-assets && LC_ALL=C sha256sum *.zip > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - id: notes
        name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BASE_VERSION: ${{ needs.prepare.outputs.base_version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["TAG"]
          base_version = os.environ["BASE_VERSION"]
          is_pre = os.environ["IS_PRERELEASE"] == "true"
          short_sha = os.environ["SHORT_SHA"][:7]

          section_lines = None
          changelog = Path("CHANGELOG.md")
          if changelog.is_file():
              heading_re = re.compile(rf"^##\s+\[{re.escape(base_version)}\](?:\s|$).*")
              next_re = re.compile(r"^##\s+\[")
              lines = changelog.read_text(encoding="utf-8").splitlines()
              collecting = False
              collected = []
              for line in lines:
                  if not collecting:
                      if heading_re.match(line):
                          collecting = True
                  else:
                      if next_re.match(line):
                          break
                      collected.append(line)
              if collecting:
                  while collected and (not collected[0].strip()):
                      collected.pop(0)
                  while collected and (not collected[-1].strip() or collected[-1].strip() == "---"):
                      collected.pop()
                  if collected:
                      section_lines = collected

          has_notes = section_lines is not None
          if has_notes:
              body = "\n".join(section_lines) + "\n"
              if is_pre:
                  banner = f"> **Pre-release / 预发布版本** — Automatically built from `{tag}` (`{short_sha}`).\n\n"
                  body = banner + body
              Path("release-notes.md").write_text(body, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8", newline="\n") as out:
              out.write(f"has_notes={'true' if has_notes else 'false'}\n")
          print(f"Extracted CHANGELOG section for {base_version}: {has_notes}")
          PY
      - name: Create or replace Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          raw = subprocess.check_output(
              ["gh", "api", "--paginate", "--slurp", f"repos/{repo}/releases?per_page=100"],
              text=True,
          )
          pages = json.loads(raw) if raw.strip() else []
          releases = [item for page in pages for item in page] if pages and isinstance(pages[0], list) else pages
          for rel in releases:
              if rel.get("tag_name") == tag:
                  if not rel.get("draft"):
                      raise SystemExit(
                          f"Published release already exists for {tag} (id={rel.get('id')}); refusing to overwrite"
                      )
                  subprocess.run(
                      ["gh", "api", "-X", "DELETE", f"repos/{repo}/releases/{rel['id']}"],
                      check=True,
                  )
                  print(f"Deleted existing draft release id={rel['id']} for {tag}")
          PY

          args=("$TAG" release-assets/* --draft --target "$GITHUB_SHA" --title "$TAG")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ "$HAS_NOTES" == "true" ]]; then
            args+=(--notes-file release-notes.md)
          else
            args+=(--generate-notes)
          fi
          gh release create "${args[@]}"
